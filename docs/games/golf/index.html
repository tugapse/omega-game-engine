<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Omega Golf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <style>
    /* The Omega neon look of the bowling, over a bright course. */
    :root {
      color-scheme: dark;
      --fg: #f6f1ff; --muted: #b9b3cd; --line: #3b3352;
      --orange: #ff8a1f; --cyan: #2de2ff; --pink: #ff3ea5; --gold: #ffd23f; --lime: #9dff3f;
      --panel: rgba(12, 9, 24, .72);
      --display: 'Bungee', system-ui, sans-serif;
    }
    html, body { margin: 0; height: 100%; background: #8fc9f0; color: var(--fg); font: 15px/1.4 system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #trail { pointer-events: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 4px #000; }

    /* Top: hole, par, strokes, distance. */
    #top { top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0 16px; }
    .chip { padding: 5px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; font-size: 13px; }
    .chip b { font-family: var(--display); font-weight: 400; color: var(--cyan); margin-right: 6px; }
    #hole-chip { border-color: var(--cyan); box-shadow: 0 0 10px rgba(45, 226, 255, .3); }
    #dist b { color: var(--gold); }
    #lie b { color: var(--lime); }
    #total b { color: var(--pink); }
    #wind i { display: inline-block; font-style: normal; font-weight: 800; color: var(--cyan); margin-right: 6px; transition: transform .3s; }

    /* Left: the club picker. */
    #clubs { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 6px; }
    #clubs button { width: 40px; height: 40px; border-radius: 50%; background: var(--panel); border: 1px solid var(--cyan); color: var(--cyan); font-size: 18px; }
    #club { min-width: 92px; text-align: center; padding: 6px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
    #club-name { font-family: var(--display); font-size: 14px; color: var(--fg); display: block; }
    #club-reach { font-size: 11px; color: var(--muted); }

    /* Right: the power bar, filled by the backswing. */
    #power { position: fixed; right: max(16px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); width: 16px; height: 42vh; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; opacity: 0; transition: opacity .2s; }
    #power.show { opacity: 1; }
    #power i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(0deg, var(--cyan), var(--gold) 70%, var(--pink)); box-shadow: 0 0 10px var(--gold); }
    #power-label { position: fixed; right: max(40px, calc(env(safe-area-inset-right) + 40px)); top: 50%; font-family: var(--display); font-size: 14px; color: var(--gold); opacity: 0; }
    #power-label.show { opacity: 1; }

    /* Bottom: the controls hint. */
    #hint { bottom: max(76px, calc(env(safe-area-inset-bottom) + 60px)); left: 0; right: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 0 16px; transition: opacity .3s; }
    #hint.hidden { opacity: 0; }
    #hint span { font-size: 12px; padding: 4px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
    #hint b { color: var(--cyan); margin-right: 4px; }

    /* Big words in the middle: shot results, the score on the hole. */
    #result { top: 30%; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 38px; color: var(--gold); opacity: 0; transform: scale(.9); transition: opacity .25s, transform .25s; text-shadow: 0 0 10px rgba(255, 210, 63, .7), 0 2px 12px #000; }
    #result.show { opacity: 1; transform: scale(1); }
    #result.big.show { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); font-size: 52px; color: var(--pink); text-shadow: 0 0 12px rgba(255, 62, 165, .9), 0 0 32px rgba(255, 62, 165, .5), 0 2px 12px #000; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } }
    #result small { display: table; margin: 8px auto 0; padding: 3px 12px; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; color: var(--fg); text-shadow: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }

    /* Map view toggle. */
    #map { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); padding: 8px 14px; border-radius: 18px; background: var(--panel); border: 1px solid var(--cyan); color: var(--cyan); font-family: var(--display); font-size: 13px; }
    #map.on { background: var(--cyan); color: #07050d; }
    #map[hidden], #gyro[hidden] { display: none; }
    #gyro { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(70px, calc(env(safe-area-inset-bottom) + 54px)); padding: 6px 12px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    #gyro.on { color: #07050d; background: var(--gold); border-color: var(--gold); }
    /* The hole's name as it flies in. */
    #intro { top: 22%; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 40px; color: var(--fg); opacity: 0; transition: opacity .4s; text-shadow: 0 0 12px rgba(45, 226, 255, .8), 0 2px 12px #000; }
    #intro.show { opacity: 1; }
    #intro small { display: block; font-size: 15px; color: var(--gold); letter-spacing: .1em; }

    /* Hidden on the start screen. */
    .gone { visibility: hidden; }
    #player-chip { border-left: 4px solid var(--shirt, var(--cyan)); font-weight: 700; }
    #player-chip[hidden] { display: none; }
    #pause { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(128px, calc(env(safe-area-inset-bottom) + 112px)); width: 44px; height: 44px; border-radius: 50%; background: var(--panel); border: 1px solid var(--cyan); box-shadow: 0 0 10px rgba(45, 226, 255, .35); font-size: 15px; font-weight: 800; letter-spacing: 1px; color: var(--cyan); }
    #pause[hidden] { display: none; }
    #turn { top: 26%; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 26px; color: var(--fg); opacity: 0; text-shadow: 0 0 10px var(--shirt, var(--cyan)), 0 2px 12px #000; }
    #turn.show { animation: turn 1.8s ease-out forwards; }
    #turn::after { content: ''; display: block; width: 140px; height: 4px; margin: 10px auto 0; border-radius: 2px; background: var(--shirt, var(--cyan)); box-shadow: 0 0 12px var(--shirt, var(--cyan)); }
    @keyframes turn { 0% { opacity: 0; transform: translateY(12px); } 15%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }

    /* Full screens: start, pause, scorecard, end. */
    .screen { position: fixed; inset: 0; display: none; padding: 16px; box-sizing: border-box; background: rgba(7, 5, 13, .55); overflow-y: auto; z-index: 3; }
    .screen .card { margin: auto; }
    .screen.show { display: grid; }
    .card { width: min(100%, 380px); box-sizing: border-box; padding: 20px 18px; text-align: center; background: var(--panel); border: 1px solid rgba(157, 255, 63, .5); border-radius: 16px; box-shadow: 0 0 24px rgba(157, 255, 63, .18); backdrop-filter: blur(4px); }
    .card.wide { width: min(100%, 640px); }
    .logo { margin: 0 0 14px; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; color: var(--lime); text-shadow: 0 0 10px rgba(157, 255, 63, .8), 0 0 26px rgba(157, 255, 63, .4); }
    .logo span { display: block; font-size: 22px; letter-spacing: .12em; color: var(--cyan); text-shadow: 0 0 10px rgba(45, 226, 255, .9); }
    .card h2 { margin: 0 0 14px; font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--gold); text-shadow: 0 0 10px rgba(255, 210, 63, .6); }
    .label { display: block; margin: 14px 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .seg button { flex: 1; padding: 9px 4px; font-size: 14px; font-weight: 600; color: var(--muted); background: transparent; border: 0; border-left: 1px solid var(--line); }
    .seg button:first-child { border-left: 0; }
    .seg button.on { color: #07050d; background: var(--lime); box-shadow: 0 0 12px rgba(157, 255, 63, .6); }
    .seg button:disabled { opacity: .3; }
    #mode-info { margin: 8px 0 0; min-height: 2.8em; font-size: 13px; color: var(--muted); }
    #names { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    #names input { width: 100%; box-sizing: border-box; padding: 7px 9px 7px 26px; font: inherit; font-size: 14px; color: var(--fg); border: 1px solid var(--line); border-radius: 10px; background: rgba(255, 255, 255, .04) radial-gradient(circle at 13px 50%, var(--dot) 4px, transparent 5px); }
    #names input:focus { outline: none; border-color: var(--lime); }
    .big { display: block; width: 100%; margin-top: 18px; padding: 13px; font-family: var(--display); font-size: 20px; color: #07050d; background: linear-gradient(90deg, var(--lime), var(--cyan)); border: 0; border-radius: 14px; box-shadow: 0 0 18px rgba(157, 255, 63, .5); }
    .big:active, .ghost:active { transform: scale(.97); }
    .ghost { display: block; width: 100%; margin-top: 10px; padding: 11px; font-size: 15px; font-weight: 700; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 14px; }
    .scroll { overflow-x: auto; }
    #card-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #card-table th, #card-table td { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
    #card-table td:first-child { text-align: left; font-weight: 700; }
    #card-table tr.par td { color: var(--muted); font-weight: 400; }
    #card-table td.under { color: var(--lime); font-weight: 800; }
    #card-table td.over { color: var(--orange); }
    #card-table i, .rank i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
    #card-table small { color: var(--muted); }
    .ranking { list-style: none; padding: 0; margin: 0; text-align: left; }
    .rank { padding: 8px 0; border-bottom: 1px solid var(--line); }
    .rank:last-child { border-bottom: 0; }
    .rank .head { display: flex; align-items: center; font-size: 17px; font-weight: 700; }
    .rank .head em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 8px; }
    .rank .head b { margin-left: auto; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--gold); }
    .rank.first .head { color: var(--gold); }
    #final-note { margin: 10px 0 0; font-size: 14px; font-weight: 600; color: var(--cyan); }
    #final-note:empty { display: none; }
    @media (max-height: 520px) {
      .card { padding: 12px 16px; width: min(100%, 520px); }
      .logo { font-size: 24px; margin-bottom: 6px; }
      .logo span { display: inline; font-size: 24px; margin-left: 8px; letter-spacing: .04em; }
      .label { margin: 8px 0 4px; }
      #mode-info { min-height: 0; margin-top: 4px; font-size: 12px; }
      .seg button { padding: 7px 4px; }
      .big { margin-top: 10px; padding: 10px; font-size: 18px; }
      .ghost { padding: 8px; margin-top: 6px; }
      #names { grid-template-columns: repeat(4, 1fr); }
    }

    /* Loading. */
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #07050d; transition: opacity .4s; z-index: 5; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .logo { font-family: var(--display); font-size: 34px; color: var(--lime); text-shadow: 0 0 14px rgba(157, 255, 63, .6); text-align: center; }
    #loading .bar { width: 220px; height: 6px; margin: 18px auto 8px; background: #2a2338; border-radius: 3px; overflow: hidden; }
    #load-bar { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--lime)); transition: width .3s; }
    #load-text { text-align: center; color: var(--muted); font-size: 13px; }
    #stats { position: fixed; left: 8px; top: 8px; font-size: 11px; color: #fff; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="trail"></canvas>

  <div id="top" class="hud">
    <span class="chip" id="player-chip" hidden></span>
    <span class="chip" id="hole-chip"><b id="hole-num">1</b><span id="hole-name">Buraco</span></span>
    <span class="chip" id="par"><b>Par</b>4</span>
    <span class="chip" id="strokes"><b>Pancadas</b>0</span>
    <span class="chip" id="dist"><b>Bandeira</b>0 m</span>
    <span class="chip" id="lie"><b>Na</b>tee</span>
    <span class="chip" id="total"><b>Total</b>–</span>
    <span class="chip" id="wind"><i id="wind-arrow">↑</i><span id="wind-speed">0 m/s</span></span>
  </div>

  <div id="clubs">
    <button id="club-prev" aria-label="Taco anterior">‹</button>
    <div id="club"><span id="club-name">Driver</span><span id="club-reach">230 m</span></div>
    <button id="club-next" aria-label="Taco seguinte">›</button>
  </div>

  <div id="power"><i id="power-fill"></i></div>
  <div id="power-label"></div>

  <div id="hint" class="hud">
    <span><b>↔</b>arrasta para apontar</span>
    <span><b>↓↑</b>puxa para baixo e sacode para cima</span>
    <span><b>↗</b>sacudir torto curva a bola</span>
  </div>

  <div id="result" class="hud"></div>
  <div id="intro" class="hud"></div>
  <div id="turn" class="hud"></div>
  <button id="pause" aria-label="Pausa" hidden>II</button>

  <div id="setup" class="screen">
    <div class="card">
      <h1 class="logo">Omega<span>Golf</span></h1>
      <span class="label">Jogo</span>
      <div class="seg"><button data-mode="round9">9 buracos</button><button data-mode="round3">3 buracos</button></div>
      <p id="mode-info"></p>
      <span class="label">Jogadores</span>
      <div class="seg"><button data-players="1">1</button><button data-players="2">2</button><button data-players="3">3</button><button data-players="4">4</button></div>
      <div id="names"></div>
      <span class="label">Contra o computador</span>
      <div class="seg"><button data-cpu="">Não</button><button data-cpu="easy">Fácil</button><button data-cpu="medium">Médio</button><button data-cpu="hard">Difícil</button></div>
      <button id="play" class="big">Jogar</button>
    </div>
  </div>

  <div id="pause-menu" class="screen">
    <div class="card">
      <h2>Pausa</h2>
      <button id="resume" class="big">Continuar</button>
      <button id="restart" class="ghost">Recomeçar</button>
      <button id="to-menu" class="ghost">Menu</button>
    </div>
  </div>

  <div id="card" class="screen">
    <div class="card wide">
      <h2 id="card-title">Cartão</h2>
      <div class="scroll"><table id="card-table"></table></div>
      <button id="card-next" class="big">Continuar</button>
    </div>
  </div>

  <div id="final" class="screen">
    <div class="card">
      <h2 id="final-title">Fim da volta</h2>
      <ul id="final-list" class="ranking"></ul>
      <p id="final-note"></p>
      <button id="again" class="big">Jogar outra vez</button>
      <button id="final-menu" class="ghost">Menu</button>
    </div>
  </div>
  <button id="map" hidden>Mapa</button>
  <button id="gyro" hidden>Giroscópio</button>
  <div id="stats" class="hud" hidden></div>

  <div id="loading">
    <div>
      <div class="logo">OMEGA GOLF</div>
      <div class="bar"><i id="load-bar"></i></div>
      <div id="load-text">A carregar…</div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
