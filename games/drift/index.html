<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Omega Drift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <style>
    /* The Omega neon look of the other games. */
    :root {
      color-scheme: dark;
      --fg: #f6f1ff; --muted: #b9b3cd; --line: #3b3352;
      --cyan: #2de2ff; --pink: #ff3ea5; --gold: #ffd23f; --teal: #26d9bf; --orange: #ff8a3d;
      --panel: rgba(12, 9, 24, .72);
      --display: 'Bungee', system-ui, sans-serif;
    }
    html, body { margin: 0; height: 100%; background: #8cbff2; color: var(--fg); font: 15px/1.4 system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 4px #000; }

    #top { top: max(10px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); display: flex; justify-content: space-between; gap: 8px; }
    .chip { padding: 5px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; font-size: 13px; }
    .chip b { font-family: var(--display); font-weight: 400; color: var(--cyan); }
    #top .group { display: flex; gap: 6px; }
    #top button { pointer-events: auto; cursor: pointer; font: inherit; font-size: 12px; color: var(--fg); padding: 5px 11px; }

    /* The speedometer: a dial with the speed in the middle. */
    #dial { right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: 132px; height: 132px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); display: grid; place-items: center; }
    #dial::before { content: ''; position: absolute; inset: 8px; border-radius: 50%; background: conic-gradient(from -120deg, var(--teal) 0deg, var(--gold) 170deg, var(--pink) 240deg, transparent 240deg); -webkit-mask: radial-gradient(circle, transparent 54px, #000 55px); mask: radial-gradient(circle, transparent 54px, #000 55px); opacity: .8; }
    #needle { position: absolute; left: 50%; top: 14px; width: 3px; height: 52px; margin-left: -1.5px; background: var(--fg); border-radius: 2px; transform-origin: 50% 52px; box-shadow: 0 0 6px var(--cyan); }
    #dial .read { text-align: center; line-height: 1; }
    #speed { font-family: var(--display); font-size: 34px; color: var(--fg); }
    #dial small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
    #gear { position: absolute; bottom: 16px; font-family: var(--display); font-size: 14px; color: var(--gold); }

    /* The drift meter, while sliding. */
    #drift { top: 22%; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 22px; color: var(--orange); letter-spacing: .06em; text-shadow: 0 0 14px rgba(255, 138, 61, .7), 0 2px 0 #0c0918; }
    #drift b { display: block; font-weight: 400; font-size: 40px; color: var(--fg); }
    #drift[hidden], #pause[hidden], #touch[hidden], #stats[hidden] { display: none; }
    #stats { left: max(16px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom)); font-size: 12px; color: var(--fg); }

    /* Touch: the steering area on the left, the accelerator and the handbrake on the right. */
    #wheel-area { position: fixed; left: 0; bottom: 0; width: 45%; height: 62%; touch-action: none; }
    #wheel-area .hint { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom)); width: 168px; height: 70px; border-radius: 35px; background: var(--panel); border: 2px solid var(--line); display: flex; justify-content: space-between; align-items: center; padding: 0 18px; box-sizing: border-box; color: var(--muted); font-size: 22px; pointer-events: none; }
    #wheel-area.down .hint { opacity: 0; }
    #knob { position: absolute; width: 0; height: 0; display: none; pointer-events: none; }
    #wheel-area.down #knob { display: block; }
    #knob::before { content: ''; position: absolute; left: -75px; top: -3px; width: 150px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .25); }
    #knob::after { content: ''; position: absolute; left: calc(var(--dx, 0px) - 26px); top: -26px; width: 52px; height: 52px; border-radius: 50%; background: rgba(45, 226, 255, .3); border: 2px solid var(--cyan); box-sizing: border-box; }
    #knob.brake::after { border-color: var(--pink); background: rgba(255, 62, 165, .3); }
    .btn { position: fixed; touch-action: none; background: var(--panel); border: 2px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 13px; text-align: center; line-height: 1.1; }
    #btn-gas { right: max(160px, calc(env(safe-area-inset-right) + 160px)); bottom: max(24px, env(safe-area-inset-bottom)); width: 92px; height: 92px; border-color: var(--teal); color: var(--teal); }
    #btn-hand { right: max(170px, calc(env(safe-area-inset-right) + 170px)); bottom: max(130px, calc(env(safe-area-inset-bottom) + 126px)); width: 72px; height: 72px; border-color: var(--orange); color: var(--orange); font-size: 11px; }
    .btn.down { background: rgba(255, 255, 255, .22); transform: scale(.94); }
    @media (orientation: portrait) { #dial { width: 108px; height: 108px; bottom: auto; top: max(54px, calc(env(safe-area-inset-top) + 48px)); } #dial::before { -webkit-mask: radial-gradient(circle, transparent 42px, #000 43px); mask: radial-gradient(circle, transparent 42px, #000 43px); } #needle { height: 40px; transform-origin: 50% 40px; } #speed { font-size: 28px; } #btn-gas { right: max(18px, env(safe-area-inset-right)); } #btn-hand { right: max(28px, calc(env(safe-area-inset-right) + 10px)); } }

    /* Screens. */
    .screen { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; padding: 16px; text-align: center; background: rgba(8, 6, 18, .55); }
    .panel { min-width: min(320px, 92vw); max-width: 460px; padding: 20px 22px; background: var(--panel); border: 1px solid var(--orange); border-radius: 20px; box-shadow: 0 0 30px rgba(255, 138, 61, .3); box-sizing: border-box; }
    .panel h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 30px; color: var(--gold); }
    .panel p { margin: 4px 0; color: var(--muted); }
    .actions { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .actions button { font-family: var(--display); font-size: 15px; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--orange); background: rgba(255, 138, 61, .15); color: var(--fg); cursor: pointer; }
    .actions button:first-child { background: var(--orange); color: #0c0918; }
    .actions.toggles button { font-family: system-ui, sans-serif; font-size: 13px; padding: 6px 12px; background: rgba(12, 9, 24, .6); color: var(--fg); border-color: var(--line); }

    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; background: #0c0918; transition: opacity .5s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; color: var(--orange); text-shadow: 0 0 16px rgba(255, 138, 61, .6); padding: 0 16px; }
    #load-track { width: 220px; height: 6px; margin: 0 auto; background: var(--line); border-radius: 3px; overflow: hidden; }
    #load-bar { height: 100%; width: 0; background: var(--orange); transition: width .2s; }
    #load-text { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="top" class="hud">
    <div class="group">
      <button id="pause-button" class="chip" aria-label="Pausa">❚❚</button>
      <span class="chip"><b id="track-name">Omega Drift</b></span>
    </div>
    <div class="group">
      <button id="reset-button" class="chip" aria-label="Voltar à pista">↺ Pista</button>
    </div>
  </div>

  <div id="drift" class="hud" hidden>Drift<b id="drift-angle">0°</b></div>

  <div id="dial" class="hud">
    <div id="needle"></div>
    <div class="read"><span id="speed">0</span><small>km/h</small></div>
    <span id="gear">N</span>
  </div>
  <div id="stats" class="hud" hidden></div>

  <div id="touch" hidden>
    <div id="wheel-area"><div class="hint"><span>◀</span><span>▶</span></div><div id="knob"></div></div>
    <div id="btn-hand" class="btn">TRAVÃO<br>MÃO</div>
    <div id="btn-gas" class="btn">ACEL.</div>
  </div>

  <div id="pause" class="screen" hidden>
    <div class="panel">
      <h2>Pausa</h2>
      <p id="keys">↑ acelera · ↓ trava e faz marcha-atrás · ← → vira · espaço é o travão de mão · R volta à pista · para derrapar: vira e toca no espaço; para sair, vira para o outro lado</p>
      <div class="actions">
        <button data-act="resume">Continuar</button>
        <button data-act="restart">Recomeçar</button>
      </div>
      <div class="actions toggles"><button data-act="assist">Ajuda ao drift: ligada</button></div>
    </div>
  </div>

  <div id="loading">
    <h1 id="load-title">Omega Drift</h1>
    <div id="load-track"><div id="load-bar"></div></div>
    <div id="load-text">A carregar…</div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
