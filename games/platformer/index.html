<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Omega Run</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <style>
    /* The Omega neon look of the other games, over a bright meadow. */
    :root {
      color-scheme: dark;
      --fg: #f6f1ff; --muted: #b9b3cd; --line: #3b3352;
      --cyan: #2de2ff; --pink: #ff3ea5; --gold: #ffd23f; --teal: #26d9bf;
      --panel: rgba(12, 9, 24, .72);
      --display: 'Bungee', system-ui, sans-serif;
    }
    html, body { margin: 0; height: 100%; background: #9fd2ff; color: var(--fg); font: 15px/1.4 system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 4px #000; }

    #top { top: max(10px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); display: flex; justify-content: space-between; gap: 8px; }
    .chip { padding: 5px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; font-size: 13px; }
    .chip b { font-family: var(--display); font-weight: 400; color: var(--cyan); }
    #top .group { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip i { font-style: normal; margin-right: 5px; }
    #lives-chip i { color: var(--pink); }
    #coins-chip i, #coins-chip b { color: var(--gold); }
    #score-chip b { color: var(--fg); letter-spacing: .04em; }
    #time-chip b { color: var(--gold); }
    #time-chip.hurry { border-color: var(--pink); }
    #time-chip.hurry b { color: var(--pink); }
    #top[hidden], #map[hidden] { display: none; }
    #load-title { font-size: clamp(24px, 6vw, 40px) !important; padding: 0 16px; }
    #big-chip b { color: var(--gold); letter-spacing: .12em; }
    #map-button { pointer-events: auto; cursor: pointer; font: inherit; color: var(--fg); }

    .actions { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
    .actions button, .node { font: inherit; color: var(--fg); cursor: pointer; }
    .actions button { font-family: var(--display); font-size: 15px; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--teal); background: rgba(38, 217, 191, .15); }
    .actions button:first-child { background: var(--teal); color: #0c0918; }
    #banner .big i { font-style: normal; color: var(--gold); letter-spacing: .15em; }

    /* The world map: a card per world, its three levels down a dotted path. */
    #map { position: fixed; inset: 0; overflow: auto; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 18px max(16px, env(safe-area-inset-left)); background: radial-gradient(900px 500px at 50% -10%, #2a1d52 0%, #0c0918 65%); }
    #map h1 { margin: 0 0 12px; text-align: center; font-family: var(--display); font-weight: 400; font-size: 28px; color: var(--teal); text-shadow: 0 0 14px rgba(38, 217, 191, .5); }
    #worlds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 980px; margin: 0 auto; }
    @media (max-width: 640px) and (orientation: portrait) { #worlds { grid-template-columns: 1fr; } }
    .world { border-radius: 16px; padding: 10px 10px 12px; border: 1px solid var(--line); background: var(--panel); }
    .world h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 400; font-size: 14px; letter-spacing: .02em; }
    .world.meadow { --w: #74d24c; background: linear-gradient(180deg, rgba(95, 191, 60, .25), rgba(12, 9, 24, .8)); }
    .world.caves { --w: #b48cff; background: linear-gradient(180deg, rgba(120, 80, 210, .3), rgba(12, 9, 24, .85)); }
    .world.clouds { --w: #ffb88a; background: linear-gradient(180deg, rgba(255, 140, 110, .28), rgba(12, 9, 24, .8)); }
    .world h2 { color: var(--w); }
    .world ol { list-style: none; margin: 0; padding: 0 0 0 10px; display: grid; gap: 8px; border-left: 2px dotted var(--w); }
    .node { width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2px 8px; text-align: left; padding: 7px 10px; border-radius: 12px; border: 1px solid var(--line); background: rgba(12, 9, 24, .6); position: relative; }
    .node::before { content: ''; position: absolute; left: -17px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--line); }
    .node.done::before { background: var(--w); box-shadow: 0 0 8px var(--w); }
    .node .num { font-family: var(--display); color: var(--w); }
    .node .name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node .big { color: var(--gold); letter-spacing: .1em; font-size: 13px; }
    .node .best { grid-column: 2 / 4; font-size: 11px; color: var(--muted); }
    .node.picked { border-color: var(--w); box-shadow: 0 0 0 2px var(--w), 0 0 18px -2px var(--w); }
    .node:hover { border-color: var(--w); }
    #map .hint { text-align: center; color: var(--muted); font-size: 12px; margin: 12px 0 0; }

    #banner { position: fixed; top: 28%; left: 16px; right: 16px; margin: 0 auto; max-width: 420px; text-align: center; padding: 18px 16px; background: var(--panel); border: 1px solid var(--teal); border-radius: 18px; box-shadow: 0 0 24px rgba(38, 217, 191, .35); animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }
    #banner b { display: block; font-family: var(--display); font-weight: 400; font-size: 34px; color: var(--gold); text-shadow: 0 0 12px rgba(255, 210, 63, .6); }
    #banner span { display: block; font-family: var(--display); font-size: 22px; color: var(--cyan); margin-top: 4px; }
    #banner small { display: block; margin-top: 10px; color: var(--muted); }
    @keyframes pop { from { transform: scale(.5); opacity: 0; } }

    /* Touch: the pad on the left (left and right halves), A and B on the right. */
    #touch[hidden] { display: none; }
    #pad, .btn { position: fixed; bottom: max(22px, env(safe-area-inset-bottom)); touch-action: none; background: var(--panel); border: 2px solid var(--line); }
    #pad { left: max(18px, env(safe-area-inset-left)); width: 168px; height: 84px; border-radius: 42px; display: flex; }
    #pad i { flex: 1; display: grid; place-items: center; font-style: normal; font-size: 26px; color: var(--muted); border-radius: 40px; }
    #pad[data-side="left"] .l, #pad[data-side="right"] .r { background: rgba(45, 226, 255, .25); color: var(--cyan); }
    .btn { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 24px; }
    #btn-a { right: max(20px, env(safe-area-inset-right)); bottom: max(46px, calc(env(safe-area-inset-bottom) + 24px)); border-color: var(--teal); color: var(--teal); }
    #btn-b { right: max(110px, calc(env(safe-area-inset-right) + 110px)); border-color: var(--pink); color: var(--pink); width: 64px; height: 64px; font-size: 20px; }
    .btn.down { background: rgba(255, 255, 255, .22); transform: scale(.94); }

    /* Phones held upright: the level is wide, so ask for landscape. */
    #turn-phone { display: none; }
    @media (pointer: coarse) and (orientation: portrait) {
      #turn-phone { display: block; position: fixed; top: 64px; left: 16px; right: 16px; text-align: center; padding: 8px 12px; background: var(--panel); border: 1px solid var(--gold); border-radius: 14px; color: var(--gold); font-size: 14px; pointer-events: none; animation: hint-out .6s 4s forwards; }
    }
    @keyframes hint-out { to { opacity: 0; visibility: hidden; } }
    #stats { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--muted); }

    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center; background: #0c0918; transition: opacity .5s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; color: var(--teal); text-shadow: 0 0 16px rgba(38, 217, 191, .6); }
    #load-track { width: 220px; height: 6px; margin: 0 auto; background: var(--line); border-radius: 3px; overflow: hidden; }
    #load-bar { height: 100%; width: 0; background: var(--teal); transition: width .2s; }
    #load-text { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="top" class="hud">
    <div class="group">
      <button class="chip" id="map-button" title="Voltar ao mapa (Esc)">☰</button>
      <span class="chip"><b id="level-name">Prado 1</b></span>
      <span class="chip" id="lives-chip" title="Vidas"><i>♥</i><b id="lives">3</b></span>
      <span class="chip" id="coins-chip" title="Moedas"><i>●</i><b id="coins">0</b></span>
      <span class="chip" id="big-chip" title="Moedas grandes"><b id="big">◇◇◇</b></span>
    </div>
    <div class="group">
      <span class="chip" id="score-chip"><b id="score">000000</b></span>
      <span class="chip" id="time-chip" title="Tempo"><i>⏱</i><b id="time">5:00</b></span>
    </div>
  </div>
  <div id="banner" hidden></div>
  <div id="map" hidden>
    <h1>Omega Run</h1>
    <div id="worlds"></div>
    <p class="hint">Escolhe um nível: setas e Enter, ou toca.</p>
  </div>
  <div id="touch" hidden>
    <div id="pad"><i class="l">◀</i><i class="r">▶</i></div>
    <div id="btn-b" class="btn">B</div>
    <div id="btn-a" class="btn">A</div>
  </div>
  <div id="turn-phone">↻ Vira o telemóvel para veres mais do nível</div>
  <div id="stats" class="hud" hidden></div>
  <div id="loading">
    <h1 id="load-title">Omega Run</h1>
    <div id="load-track"><div id="load-bar"></div></div>
    <div id="load-text">A carregar…</div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
